version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: ocr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ocr_dw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ocr_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object Storage (Data Lake) Service
  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: ocr_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Helper service to automatically create MinIO Buckets
  minio-init:
    image: minio/mc:RELEASE.2023-05-18T16-59-00Z
    container_name: ocr_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/input-documents;
      mc mb --ignore-existing myminio/extracted-text;
      mc mb --ignore-existing myminio/processed-data;
      exit 0;
      "

  # Dagster Webserver (Dagit) UI
  dagster_webserver:
    image: python:3.10-slim
    container_name: ocr_dagster_webserver
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/dagster/app
    workdir: /opt/dagster/app
    environment:
      - DAGSTER_HOME=/opt/dagster/app/dagster
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ocr_dw}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      bash -c "
      pip install dagster dagster-webserver dagster-postgres dagstermill pandas boto3 psycopg2-binary easyocr pytesseract pdf2image opencv-python-headless &&
      dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/app/dagster/workspace.yaml
      "
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Dagster Daemon (Scheduler & Queue runner)
  dagster_daemon:
    image: python:3.10-slim
    container_name: ocr_dagster_daemon
    volumes:
      - .:/opt/dagster/app
    workdir: /opt/dagster/app
    environment:
      - DAGSTER_HOME=/opt/dagster/app/dagster
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ocr_dw}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      bash -c "
      pip install dagster dagster-webserver dagster-postgres dagstermill pandas boto3 psycopg2-binary easyocr pytesseract pdf2image opencv-python-headless &&
      dagster-daemon run
      "
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
