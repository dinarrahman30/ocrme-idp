version: '3.8'

services:
  ocrme-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocrme-idp-system
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    volumes:
      # Persist SQLite database and input/output files on the host machine
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  eval:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocrme-eval-harness
    volumes:
      - ./data:/app/data
    command: python3 ocr_eval.py --auto
